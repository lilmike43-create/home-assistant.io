################################################################################################################
# M5Stack Dial - Home Assistant Multi-Function Controller
# Based on working M5Dial configuration with proven display settings
################################################################################################################

substitutions:
  # Device customization
  device_name: m5dial-controller
  friendly_name: M5Dial Controller

  ################################################################################
  # ⚠️ CRITICAL: Entities & Display Names Work Together!
  ################################################################################
  # When customizing, you MUST update BOTH sections:
  #
  # Step 1: Change entity ID below          ↓
  # Step 2: Change display name below       ↓
  # Step 3: Recompile & upload firmware     ↓
  #
  # EXAMPLE - To change Device 1 from Desk Lamp to Kitchen:
  #   light_1: "light.kitchen"              ← Change this
  #   light_1_name: "Kit"                   ← AND change this (4-5 chars max)
  ################################################################################

  # Home Assistant Entities - Change these to YOUR entity IDs
  light_1: "light.desk_lamp"
  light_2: "light.bedroom"
  light_3: "light.kitchen"
  light_4: "light.living_room"
  climate_entity: "climate.living_room"
  switch_1: "switch.coffee_maker"

  # Display Names - Change these to match YOUR entities above (SHORT names!)
  light_1_name: "Desk"      # Device 1 name (max 4-5 characters)
  light_2_name: "Bed"       # Device 2 name
  light_3_name: "Kit"       # Device 3 name
  light_4_name: "Live"      # Device 4 name
  climate_name: "Clim"      # Device 5 name
  switch_1_name: "Coff"     # Device 6 name

  # Display colors
  background_color: '000000'
  primary_color: 'FF8C00'      # Orange
  secondary_color: 'FFFFFF'    # White
  accent_color: '00D9FF'       # Cyan
  color_warm: 'FFB366'         # Warm white
  color_cool: '66B3FF'         # Cool white

  # Sounds
  menu_sound: 'beep:d=64,o=5,b=255:c7'
  success_sound: 'success:d=24,o=5,b=100:c,g,b'

################################################################################################################

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%
      - display.page.show: home_page
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf

###################
# NETWORK
###################

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot if WiFi connection fails
  ap:
    ssid: "${friendly_name} Fallback"
    password: "m5dial123"

captive_portal:

api:
  id: api_server
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:

###################
# HARDWARE
###################

# I2C Bus for touchscreen and RTC
i2c:
  - id: internal_i2c
    sda: GPIO11
    scl: GPIO12
    scan: false

# SPI Bus for display
spi:
  id: spi_bus
  mosi_pin: GPIO5
  clk_pin: GPIO6

# Touchscreen
touchscreen:
  - platform: ft5x06
    id: touchscreen_dial
    i2c_id: internal_i2c
    address: 0x38
    interrupt_pin: GPIO14
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

# RTC (Real-Time Clock)
time:
  - platform: pcf8563
    id: rtctime
    i2c_id: internal_i2c
    address: 0x51
    update_interval: never

  - platform: homeassistant
    id: esptime
    on_time_sync:
      then:
        - pcf8563.write_time:

###################
# OUTPUTS
###################

output:
  # Buzzer for sound feedback
  - platform: ledc
    pin: GPIO3
    id: buzzer

  # Backlight PWM control
  - platform: ledc
    pin: GPIO9
    id: backlight_pwm

###################
# LIGHTS
###################

light:
  - platform: monochromatic
    name: "Backlight"
    output: backlight_pwm
    id: backlight
    default_transition_length: 0s
    restore_mode: ALWAYS_ON
    internal: true

###################
# SOUND
###################

rtttl:
  output: buzzer
  gain: 0.05

###################
# GLOBALS
###################

globals:
  # Selected device (1-4 for lights, 5 for climate, 6 for switch)
  - id: selected_device
    type: int
    restore_value: true
    initial_value: '1'

  # Control mode: 0=device_select, 1=brightness, 2=color_picker, 3=climate
  - id: control_mode
    type: int
    restore_value: false
    initial_value: '0'

  # RGB color values for color picker (0-255)
  - id: rgb_red
    type: int
    restore_value: false
    initial_value: '255'

  - id: rgb_green
    type: int
    restore_value: false
    initial_value: '255'

  - id: rgb_blue
    type: int
    restore_value: false
    initial_value: '255'

  # Color channel being adjusted: 0=red, 1=green, 2=blue
  - id: color_channel
    type: int
    restore_value: false
    initial_value: '0'

  # Inactivity timer
  - id: inactivity_time
    type: int
    restore_value: false
    initial_value: '0'

###################
# SENSORS
###################

sensor:
  # Rotary encoder for value control
  - platform: rotary_encoder
    id: encoder
    pin_a: GPIO40
    pin_b: GPIO41
    on_clockwise:
      then:
        - rtttl.play: ${menu_sound}
        - lambda: |-
            id(inactivity_time) = 0;

            // Mode 0: Device selection - cycle through devices
            if (id(control_mode) == 0) {
              id(selected_device) = (id(selected_device) % 6) + 1;
            }
            // Mode 1: Brightness control
            else if (id(control_mode) == 1) {
              // Brightness +10% for selected light
            }
            // Mode 2: RGB Color picker - adjust current channel
            else if (id(control_mode) == 2) {
              if (id(color_channel) == 0) id(rgb_red) = min(255, id(rgb_red) + 10);
              else if (id(color_channel) == 1) id(rgb_green) = min(255, id(rgb_green) + 10);
              else if (id(color_channel) == 2) id(rgb_blue) = min(255, id(rgb_blue) + 10);
            }
        # Brightness control for each light - using C++ API
        - lambda: |-
            if (id(control_mode) == 1) {
              // Calculate new brightness
              int current = 0;
              int new_val = 0;
              std::string entity = "";

              if (id(selected_device) == 1) {
                current = (int)id(light_1_brightness).state;
                entity = "${light_1}";
              } else if (id(selected_device) == 2) {
                current = (int)id(light_2_brightness).state;
                entity = "${light_2}";
              } else if (id(selected_device) == 3) {
                current = (int)id(light_3_brightness).state;
                entity = "${light_3}";
              } else if (id(selected_device) == 4) {
                current = (int)id(light_4_brightness).state;
                entity = "${light_4}";
              } else {
                return;  // Not a light
              }

              new_val = current + 26;
              if (new_val > 255) new_val = 255;

              // Call Home Assistant service using C++ API
              api::HomeassistantServiceResponse resp;
              resp.service = "light.turn_on";

              api::HomeassistantServiceMap kv;
              kv.key = "entity_id";
              kv.value = entity;
              resp.data.push_back(kv);

              kv.key = "brightness";
              kv.value = to_string(new_val);
              resp.data.push_back(kv);

              id(api_server).send_homeassistant_service_call(resp);
            }
        # Climate control
        - if:
            condition:
              lambda: 'return id(control_mode) == 3;'
            then:
              - homeassistant.action:
                  service: climate.set_temperature
                  data:
                    entity_id: ${climate_entity}
                  data_template:
                    temperature: '{{ my_variable | float }}'
                  variables:
                    my_variable: |-
                      return id(climate_temperature).state + 1.0;

    on_anticlockwise:
      then:
        - rtttl.play: ${menu_sound}
        - lambda: |-
            id(inactivity_time) = 0;

            // Mode 0: Device selection - cycle backwards
            if (id(control_mode) == 0) {
              id(selected_device) = id(selected_device) - 1;
              if (id(selected_device) < 1) id(selected_device) = 6;
            }
            // Mode 1: Brightness control (handled by actions below)
            // Mode 2: RGB Color picker - decrease current channel
            else if (id(control_mode) == 2) {
              if (id(color_channel) == 0) id(rgb_red) = max(0, id(rgb_red) - 10);
              else if (id(color_channel) == 1) id(rgb_green) = max(0, id(rgb_green) - 10);
              else if (id(color_channel) == 2) id(rgb_blue) = max(0, id(rgb_blue) - 10);
            }
        # Brightness control for each light - decrease
        - lambda: |-
            if (id(control_mode) == 1) {
              // Calculate new brightness
              int current = 0;
              int new_val = 0;
              std::string entity = "";

              if (id(selected_device) == 1) {
                current = (int)id(light_1_brightness).state;
                entity = "${light_1}";
              } else if (id(selected_device) == 2) {
                current = (int)id(light_2_brightness).state;
                entity = "${light_2}";
              } else if (id(selected_device) == 3) {
                current = (int)id(light_3_brightness).state;
                entity = "${light_3}";
              } else if (id(selected_device) == 4) {
                current = (int)id(light_4_brightness).state;
                entity = "${light_4}";
              } else {
                return;  // Not a light
              }

              new_val = current - 26;
              if (new_val < 0) new_val = 0;

              // Call Home Assistant service using C++ API
              api::HomeassistantServiceResponse resp;
              resp.service = "light.turn_on";

              api::HomeassistantServiceMap kv;
              kv.key = "entity_id";
              kv.value = entity;
              resp.data.push_back(kv);

              kv.key = "brightness";
              kv.value = to_string(new_val);
              resp.data.push_back(kv);

              id(api_server).send_homeassistant_service_call(resp);
            }
        # Climate control
        - if:
            condition:
              lambda: 'return id(control_mode) == 3;'
            then:
              - homeassistant.action:
                  service: climate.set_temperature
                  data:
                    entity_id: ${climate_entity}
                  data_template:
                    temperature: '{{ my_variable | float }}'
                  variables:
                    my_variable: |-
                      return id(climate_temperature).state - 1.0;

  # Home Assistant sensors for all lights
  - platform: homeassistant
    id: light_1_brightness
    entity_id: ${light_1}
    attribute: brightness
    internal: true
    filters:
      - lambda: 'if (isnan(x)) { return 0; } else { return x; }'

  - platform: homeassistant
    id: light_2_brightness
    entity_id: ${light_2}
    attribute: brightness
    internal: true
    filters:
      - lambda: 'if (isnan(x)) { return 0; } else { return x; }'

  - platform: homeassistant
    id: light_3_brightness
    entity_id: ${light_3}
    attribute: brightness
    internal: true
    filters:
      - lambda: 'if (isnan(x)) { return 0; } else { return x; }'

  - platform: homeassistant
    id: light_4_brightness
    entity_id: ${light_4}
    attribute: brightness
    internal: true
    filters:
      - lambda: 'if (isnan(x)) { return 0; } else { return x; }'

  - platform: homeassistant
    id: climate_temperature
    entity_id: ${climate_entity}
    attribute: temperature
    internal: true
    filters:
      - lambda: 'if (isnan(x)) { return 20; } else { return x; }'

###################
# TEXT SENSORS
###################

text_sensor:
  # Entity states for all lights
  - platform: homeassistant
    id: light_1_state
    entity_id: ${light_1}
    internal: true

  - platform: homeassistant
    id: light_2_state
    entity_id: ${light_2}
    internal: true

  - platform: homeassistant
    id: light_3_state
    entity_id: ${light_3}
    internal: true

  - platform: homeassistant
    id: light_4_state
    entity_id: ${light_4}
    internal: true

  - platform: homeassistant
    id: climate_state
    entity_id: ${climate_entity}
    internal: true

  - platform: homeassistant
    id: switch_1_state
    entity_id: ${switch_1}
    internal: true

  - platform: wifi_info
    ip_address:
      id: wifi_ip
      internal: true

###################
# BINARY SENSORS
###################

binary_sensor:
  # Front button (center push button)
  - platform: gpio
    name: "Front Button"
    id: front_button
    pin:
      number: GPIO42
      inverted: true
    internal: true
    on_press:
      then:
        - rtttl.play: ${menu_sound}
        - lambda: |-
            id(inactivity_time) = 0;

            // Mode 0 (device select): Enter control mode
            if (id(control_mode) == 0) {
              if (id(selected_device) <= 4) {
                id(control_mode) = 1;  // Brightness mode for lights
                id(dial_display).show_page(id(control_page));
              } else if (id(selected_device) == 5) {
                id(control_mode) = 3;  // Climate mode
                id(dial_display).show_page(id(control_page));
              } else if (id(selected_device) == 6) {
                // Toggle switch directly and stay on home page
                // No mode change, just toggle
              }
            }
            // Any other mode: Return to home
            else {
              id(control_mode) = 0;
              id(dial_display).show_page(id(home_page));
            }
        # Toggle switch if device 6 is selected
        - if:
            condition:
              lambda: 'return id(control_mode) == 0 && id(selected_device) == 6;'
            then:
              - homeassistant.action:
                  service: switch.toggle
                  data:
                    entity_id: ${switch_1}

  # Touchscreen - Home button (always visible)
  - platform: touchscreen
    name: "Home Button"
    internal: true
    x_min: 80
    x_max: 160
    y_min: 0
    y_max: 50
    on_press:
      - rtttl.play: ${menu_sound}
      - lambda: |-
          id(control_mode) = 0;
          id(inactivity_time) = 0;
          id(dial_display).show_page(id(home_page));

  # Touchscreen - Color mode button (when in brightness mode)
  - platform: touchscreen
    name: "Color Mode Button"
    internal: true
    x_min: 0
    x_max: 70
    y_min: 0
    y_max: 70
    on_press:
      - lambda: |-
          if (id(control_mode) == 1) {  // Only in brightness mode
            id(control_mode) = 2;  // Switch to color picker
            id(color_channel) = 0;  // Start with red channel
          }

  # Touchscreen - Top-right action button (APPLY in color mode, ON/OFF in brightness mode)
  - platform: touchscreen
    name: "Top Right Action Button"
    internal: true
    x_min: 170
    x_max: 240
    y_min: 0
    y_max: 70
    on_press:
      # Mode 2: Apply RGB color
      - lambda: |-
          if (id(control_mode) == 2) {
            std::string entity = "";

            if (id(selected_device) == 1) {
              entity = "${light_1}";
            } else if (id(selected_device) == 2) {
              entity = "${light_2}";
            } else if (id(selected_device) == 3) {
              entity = "${light_3}";
            } else if (id(selected_device) == 4) {
              entity = "${light_4}";
            } else {
              return;  // Not a light
            }

            // Format RGB color as [R,G,B]
            char color_buf[32];
            sprintf(color_buf, "[%d,%d,%d]", id(rgb_red), id(rgb_green), id(rgb_blue));

            // Call Home Assistant service using C++ API
            api::HomeassistantServiceResponse resp;
            resp.service = "light.turn_on";

            api::HomeassistantServiceMap kv;
            kv.key = "entity_id";
            kv.value = entity;
            resp.data.push_back(kv);

            kv.key = "rgb_color";
            kv.value = std::string(color_buf);
            resp.data.push_back(kv);

            id(api_server).send_homeassistant_service_call(resp);

            // Return to brightness mode after applying color
            id(control_mode) = 1;
          }
      # Mode 1: Light ON/OFF toggle
      - lambda: |-
          if (id(control_mode) == 1) {
            std::string entity = "";

            if (id(selected_device) == 1) {
              entity = "${light_1}";
            } else if (id(selected_device) == 2) {
              entity = "${light_2}";
            } else if (id(selected_device) == 3) {
              entity = "${light_3}";
            } else if (id(selected_device) == 4) {
              entity = "${light_4}";
            } else {
              return;  // Not a light
            }

            // Call Home Assistant service using C++ API
            api::HomeassistantServiceResponse resp;
            resp.service = "light.toggle";

            api::HomeassistantServiceMap kv;
            kv.key = "entity_id";
            kv.value = entity;
            resp.data.push_back(kv);

            id(api_server).send_homeassistant_service_call(resp);
          }
      - rtttl.play: ${menu_sound}

  # Touchscreen - Switch RGB channel (bottom center, when in color picker)
  - platform: touchscreen
    name: "Next RGB Channel"
    internal: true
    x_min: 80
    x_max: 160
    y_min: 190
    y_max: 240
    on_press:
      - rtttl.play: ${menu_sound}
      - lambda: |-
          if (id(control_mode) == 2) {  // In color picker mode
            id(color_channel) = (id(color_channel) + 1) % 3;  // Cycle R->G->B->R
          }

###################
# INTERVALS
###################

interval:
  # Inactivity timer
  - interval: 1s
    then:
      - lambda: |-
          id(inactivity_time) += 1;

          // Dim backlight after 30 seconds of inactivity
          if (id(inactivity_time) == 30) {
            auto call = id(backlight).turn_on();
            call.set_brightness(0.3);
            call.perform();
          }

          // Return to home after 60 seconds
          if (id(inactivity_time) == 60) {
            id(control_mode) = 0;
            id(dial_display).show_page(id(home_page));
            auto call = id(backlight).turn_on();
            call.set_brightness(1.0);
            call.perform();
          }

###################
# COLORS
###################

color:
  - id: color_background
    hex: ${background_color}
  - id: color_primary
    hex: ${primary_color}
  - id: color_secondary
    hex: ${secondary_color}
  - id: color_accent
    hex: ${accent_color}
  - id: color_warm
    hex: ${color_warm}
  - id: color_cool
    hex: ${color_cool}
  - id: color_on
    hex: '00FF00'
  - id: color_off
    hex: '666666'
  - id: color_red
    hex: 'FF0000'
  - id: color_green
    hex: '00FF00'
  - id: color_blue
    hex: '0000FF'

###################
# FONTS
###################

font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 24
    glyphs: " !\"#$%&'()*+,-./:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°0123456789"

  - file: "gfonts://Roboto"
    id: font_large
    size: 48
    glyphs: " !\"#$%&'()*+,-./:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°0123456789"

  - file: "gfonts://Roboto"
    id: font_medium
    size: 20
    glyphs: " !\"#$%&'()*+,-./:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°0123456789"

  - file: "gfonts://Roboto"
    id: font_small
    size: 14
    glyphs: " !\"#$%&'()*+,-./:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°0123456789"

###################
# DISPLAY
###################

display:
  - platform: ili9xxx
    id: dial_display
    model: GC9A01A
    cs_pin: GPIO7
    dc_pin: GPIO4
    reset_pin: GPIO8
    invert_colors: true
    update_interval: 0.05s
    rotation: 0
    pages:
      ###################
      # HOME PAGE
      ###################
      - id: home_page
        lambda: |-
          // Background
          it.filled_circle(120, 120, 120, id(color_background));

          // Curved title text along top arc - "SELECT DEVICE"
          const char* title = "SELECT DEVICE";
          int title_len = strlen(title);
          float title_spacing = 5.5;  // Degrees between characters
          float title_start_angle = -90 - (title_len * title_spacing / 2);  // Center the text
          int title_radius = 105;
          for (int i = 0; i < title_len; i++) {
            float angle = (title_start_angle + i * title_spacing) * 0.01745329;
            int x = 120 + (int)(title_radius * cos(angle));
            int y = 120 + (int)(title_radius * sin(angle));
            char str[2] = {title[i], '\0'};
            it.print(x, y, id(font_medium), id(color_primary), TextAlign::CENTER, str);
          }

          // Center circle for selected device
          it.filled_circle(120, 120, 35, id(color_primary));

          // Show selected device number
          it.printf(120, 120, id(font_large), id(color_background), TextAlign::CENTER, "%d", id(selected_device));

          // Device positions in circle (6 devices around center)
          // Device 1 - Light 1 (top)
          int dev1_x = 120, dev1_y = 60;
          bool light1_on = (id(light_1_state).state == "on");
          if (id(selected_device) == 1) {
            it.filled_circle(dev1_x, dev1_y, 22, id(color_accent));
          } else if (light1_on) {
            it.filled_circle(dev1_x, dev1_y, 22, id(color_primary));
          } else {
            it.circle(dev1_x, dev1_y, 22, id(color_secondary));
          }
          it.print(dev1_x, dev1_y - 4, id(font_small), (id(selected_device) == 1 || light1_on) ? id(color_background) : id(color_secondary), TextAlign::CENTER, "${light_1_name}");
          it.print(dev1_x, dev1_y + 8, id(font_small), (id(selected_device) == 1 || light1_on) ? id(color_background) : id(color_secondary), TextAlign::CENTER, "1");

          // Device 2 - Light 2 (top-right)
          int dev2_x = 170, dev2_y = 85;
          bool light2_on = (id(light_2_state).state == "on");
          if (id(selected_device) == 2) {
            it.filled_circle(dev2_x, dev2_y, 22, id(color_accent));
          } else if (light2_on) {
            it.filled_circle(dev2_x, dev2_y, 22, id(color_primary));
          } else {
            it.circle(dev2_x, dev2_y, 22, id(color_secondary));
          }
          it.print(dev2_x, dev2_y - 4, id(font_small), (id(selected_device) == 2 || light2_on) ? id(color_background) : id(color_secondary), TextAlign::CENTER, "${light_2_name}");
          it.print(dev2_x, dev2_y + 8, id(font_small), (id(selected_device) == 2 || light2_on) ? id(color_background) : id(color_secondary), TextAlign::CENTER, "2");

          // Device 3 - Light 3 (bottom-right)
          int dev3_x = 170, dev3_y = 155;
          bool light3_on = (id(light_3_state).state == "on");
          if (id(selected_device) == 3) {
            it.filled_circle(dev3_x, dev3_y, 22, id(color_accent));
          } else if (light3_on) {
            it.filled_circle(dev3_x, dev3_y, 22, id(color_primary));
          } else {
            it.circle(dev3_x, dev3_y, 22, id(color_secondary));
          }
          it.print(dev3_x, dev3_y - 4, id(font_small), (id(selected_device) == 3 || light3_on) ? id(color_background) : id(color_secondary), TextAlign::CENTER, "${light_3_name}");
          it.print(dev3_x, dev3_y + 8, id(font_small), (id(selected_device) == 3 || light3_on) ? id(color_background) : id(color_secondary), TextAlign::CENTER, "3");

          // Device 4 - Light 4 (bottom)
          int dev4_x = 120, dev4_y = 180;
          bool light4_on = (id(light_4_state).state == "on");
          if (id(selected_device) == 4) {
            it.filled_circle(dev4_x, dev4_y, 22, id(color_accent));
          } else if (light4_on) {
            it.filled_circle(dev4_x, dev4_y, 22, id(color_primary));
          } else {
            it.circle(dev4_x, dev4_y, 22, id(color_secondary));
          }
          it.print(dev4_x, dev4_y - 4, id(font_small), (id(selected_device) == 4 || light4_on) ? id(color_background) : id(color_secondary), TextAlign::CENTER, "${light_4_name}");
          it.print(dev4_x, dev4_y + 8, id(font_small), (id(selected_device) == 4 || light4_on) ? id(color_background) : id(color_secondary), TextAlign::CENTER, "4");

          // Device 5 - Climate (bottom-left)
          int dev5_x = 70, dev5_y = 155;
          if (id(selected_device) == 5) {
            it.filled_circle(dev5_x, dev5_y, 22, id(color_accent));
          } else {
            it.circle(dev5_x, dev5_y, 22, id(color_secondary));
          }
          it.print(dev5_x, dev5_y - 4, id(font_small), id(selected_device) == 5 ? id(color_background) : id(color_secondary), TextAlign::CENTER, "${climate_name}");
          it.print(dev5_x, dev5_y + 8, id(font_small), id(selected_device) == 5 ? id(color_background) : id(color_secondary), TextAlign::CENTER, "5");

          // Device 6 - Switch 1 (top-left)
          int dev6_x = 70, dev6_y = 85;
          bool switch_on = (id(switch_1_state).state == "on");
          if (id(selected_device) == 6) {
            it.filled_circle(dev6_x, dev6_y, 22, id(color_accent));
          } else if (switch_on) {
            it.filled_circle(dev6_x, dev6_y, 22, id(color_primary));
          } else {
            it.circle(dev6_x, dev6_y, 22, id(color_secondary));
          }
          it.print(dev6_x, dev6_y - 4, id(font_small), (id(selected_device) == 6 || switch_on) ? id(color_background) : id(color_secondary), TextAlign::CENTER, "${switch_1_name}");
          it.print(dev6_x, dev6_y + 8, id(font_small), (id(selected_device) == 6 || switch_on) ? id(color_background) : id(color_secondary), TextAlign::CENTER, "6");

          // Curved instructions text along bottom arc
          const char* instructions = "Turn-select Press-control";
          int inst_len = strlen(instructions);
          float inst_spacing = 3.8;  // Degrees between characters
          float inst_start_angle = 90 - (inst_len * inst_spacing / 2);  // Center the text at bottom
          int inst_radius = 108;
          for (int i = 0; i < inst_len; i++) {
            float angle = (inst_start_angle + i * inst_spacing) * 0.01745329;
            int x = 120 + (int)(inst_radius * cos(angle));
            int y = 120 + (int)(inst_radius * sin(angle));
            char str[2] = {instructions[i], '\0'};
            it.print(x, y, id(font_small), id(color_secondary), TextAlign::CENTER, str);
          }

      ###################
      # CONTROL PAGE
      ###################
      - id: control_page
        lambda: |-
          // Background
          it.filled_circle(120, 120, 120, id(color_background));

          // Home button at top
          it.print(120, 10, id(font_small), id(color_primary), TextAlign::TOP_CENTER, "< Home");

          // Display based on current mode
          if (id(control_mode) == 1) {
            // Light Control - show selected light
            // Curved "BRIGHTNESS" text along top arc
            const char* title = "BRIGHTNESS";
            int title_len = strlen(title);
            float title_spacing = 7.0;  // Degrees between characters
            float title_start_angle = -90 - (title_len * title_spacing / 2);
            int title_radius = 105;
            for (int i = 0; i < title_len; i++) {
              float angle = (title_start_angle + i * title_spacing) * 0.01745329;
              int x = 120 + (int)(title_radius * cos(angle));
              int y = 120 + (int)(title_radius * sin(angle));
              char str[2] = {title[i], '\0'};
              it.print(x, y, id(font_title), id(color_primary), TextAlign::CENTER, str);
            }

            // Show which light is selected
            std::string light_name = "";
            if (id(selected_device) == 1) light_name = "${light_1_name}";
            else if (id(selected_device) == 2) light_name = "${light_2_name}";
            else if (id(selected_device) == 3) light_name = "${light_3_name}";
            else if (id(selected_device) == 4) light_name = "${light_4_name}";
            it.print(120, 45, id(font_small), id(color_accent), TextAlign::TOP_CENTER, light_name.c_str());

            // Get brightness for selected light
            float brightness_pct = 0;
            bool has_brightness = false;

            if (id(selected_device) == 1 && !isnan(id(light_1_brightness).state)) {
              brightness_pct = (id(light_1_brightness).state / 255.0) * 100.0;
              has_brightness = true;
            }
            else if (id(selected_device) == 2 && !isnan(id(light_2_brightness).state)) {
              brightness_pct = (id(light_2_brightness).state / 255.0) * 100.0;
              has_brightness = true;
            }
            else if (id(selected_device) == 3 && !isnan(id(light_3_brightness).state)) {
              brightness_pct = (id(light_3_brightness).state / 255.0) * 100.0;
              has_brightness = true;
            }
            else if (id(selected_device) == 4 && !isnan(id(light_4_brightness).state)) {
              brightness_pct = (id(light_4_brightness).state / 255.0) * 100.0;
              has_brightness = true;
            }

            if (has_brightness) {
              // Circular progress
              int arc_degrees = (int)(brightness_pct * 3.6);

              // Background circle
              it.circle(120, 140, 70, id(color_secondary));

              // Progress arc
              for (int angle = 0; angle < arc_degrees; angle++) {
                float rad = (angle - 90) * 0.01745329;
                int x = 120 + (int)(70 * cos(rad));
                int y = 140 + (int)(70 * sin(rad));
                it.filled_circle(x, y, 4, id(color_primary));
              }

              // Brightness percentage
              it.printf(120, 125, id(font_large), id(color_accent), TextAlign::CENTER, "%.0f", brightness_pct);
              it.print(120, 155, id(font_medium), id(color_secondary), TextAlign::CENTER, "%");
            }

            it.print(40, 25, id(font_small), id(color_accent), TextAlign::CENTER, "COLOR");

            // ON/OFF toggle button label in top-right
            it.print(200, 25, id(font_small), id(color_accent), TextAlign::CENTER, "ON/OFF");

            // Curved instruction text along bottom arc
            const char* instructions = "Turn to adjust";
            int inst_len = strlen(instructions);
            float inst_spacing = 5.5;
            float inst_start_angle = 90 - (inst_len * inst_spacing / 2);
            int inst_radius = 108;
            for (int i = 0; i < inst_len; i++) {
              float angle = (inst_start_angle + i * inst_spacing) * 0.01745329;
              int x = 120 + (int)(inst_radius * cos(angle));
              int y = 120 + (int)(inst_radius * sin(angle));
              char str[2] = {instructions[i], '\0'};
              it.print(x, y, id(font_small), id(color_secondary), TextAlign::CENTER, str);
            }
          }
          else if (id(control_mode) == 2) {
            // RGB Color Picker
            // Curved "COLOR PICKER" text along top arc
            const char* title = "COLOR PICKER";
            int title_len = strlen(title);
            float title_spacing = 6.0;
            float title_start_angle = -90 - (title_len * title_spacing / 2);
            int title_radius = 105;
            for (int i = 0; i < title_len; i++) {
              float angle = (title_start_angle + i * title_spacing) * 0.01745329;
              int x = 120 + (int)(title_radius * cos(angle));
              int y = 120 + (int)(title_radius * sin(angle));
              char str[2] = {title[i], '\0'};
              it.print(x, y, id(font_medium), id(color_primary), TextAlign::CENTER, str);
            }

            // Show which channel
            std::string channel_name = "";
            Color channel_color = id(color_secondary);
            int channel_value = 0;

            if (id(color_channel) == 0) {
              channel_name = "RED";
              channel_color = id(color_red);
              channel_value = id(rgb_red);
            } else if (id(color_channel) == 1) {
              channel_name = "GREEN";
              channel_color = id(color_green);
              channel_value = id(rgb_green);
            } else {
              channel_name = "BLUE";
              channel_color = id(color_blue);
              channel_value = id(rgb_blue);
            }

            it.print(120, 35, id(font_medium), channel_color, TextAlign::TOP_CENTER, channel_name.c_str());

            // Color preview circle
            Color preview = Color(id(rgb_red), id(rgb_green), id(rgb_blue));
            it.filled_circle(120, 110, 45, preview);
            it.circle(120, 110, 47, id(color_primary));

            // Channel value arc
            int arc_degrees = (int)((channel_value / 255.0) * 360);
            for (int angle = 0; angle < arc_degrees; angle++) {
              float rad = (angle - 90) * 0.01745329;
              int x = 120 + (int)(65 * cos(rad));
              int y = 110 + (int)(65 * sin(rad));
              it.filled_circle(x, y, 3, channel_color);
            }

            // RGB values
            it.printf(120, 170, id(font_small), id(color_red), TextAlign::CENTER, "R %d", id(rgb_red));
            it.printf(70, 190, id(font_small), id(color_green), TextAlign::CENTER, "G %d", id(rgb_green));
            it.printf(170, 190, id(font_small), id(color_blue), TextAlign::CENTER, "B %d", id(rgb_blue));

            // Curved instruction along bottom arc
            const char* instructions = "Tap bottom-switch";
            int inst_len = strlen(instructions);
            float inst_spacing = 4.5;
            float inst_start_angle = 90 - (inst_len * inst_spacing / 2);
            int inst_radius = 108;
            for (int i = 0; i < inst_len; i++) {
              float angle = (inst_start_angle + i * inst_spacing) * 0.01745329;
              int x = 120 + (int)(inst_radius * cos(angle));
              int y = 120 + (int)(inst_radius * sin(angle));
              char str[2] = {instructions[i], '\0'};
              it.print(x, y, id(font_small), id(color_secondary), TextAlign::CENTER, str);
            }
            it.print(200, 25, id(font_small), id(color_accent), TextAlign::CENTER, "APPLY");
          }
          else if (id(control_mode) == 3) {
            // Climate Control
            it.print(120, 40, id(font_title), id(color_primary), TextAlign::TOP_CENTER, "Climate");

            // State - check if loaded
            if (id(climate_state).has_state()) {
              std::string state_text = (id(climate_state).state == "heat") ? "HEATING" :
                                      (id(climate_state).state == "cool") ? "COOLING" : "OFF";
              auto state_color = (id(climate_state).state == "off") ? id(color_off) : id(color_on);
              it.print(120, 75, id(font_medium), state_color, TextAlign::TOP_CENTER, state_text.c_str());
            } else {
              it.print(120, 75, id(font_medium), id(color_secondary), TextAlign::TOP_CENTER, "Loading...");
            }

            // Temperature circle - check if loaded
            if (!isnan(id(climate_temperature).state)) {
              float temp = id(climate_temperature).state;
              int arc_degrees = (int)((temp - 15) * 12);  // 15°C = 0°, 45°C = 360°
              if (arc_degrees < 0) arc_degrees = 0;
              if (arc_degrees > 360) arc_degrees = 360;

              // Draw arc showing temperature
              for (int angle = 0; angle < arc_degrees; angle++) {
                float rad = (angle - 90) * 0.01745329;
                int x = 120 + (int)(60 * cos(rad));
                int y = 140 + (int)(60 * sin(rad));
                it.filled_circle(x, y, 3, id(color_primary));
              }

              // Temperature value
              it.printf(120, 140, id(font_large), id(color_secondary), TextAlign::CENTER, "%.1f C", temp);
            }

            it.print(120, 200, id(font_small), id(color_secondary), TextAlign::TOP_CENTER, "Turn to adjust temp");
          }

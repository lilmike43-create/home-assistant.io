# M5Dial Complete Configuration for Home Assistant Control
# This configuration creates a multi-mode controller for:
# - Light brightness control
# - Media player volume control
# - Climate/thermostat temperature control
#
# Press the center button to cycle through modes
# Rotate the dial to adjust values
# The display shows the current mode and value with visual feedback

substitutions:
  device_name: m5dial-controller
  friendly_name: M5Dial Controller

  # Replace these with your actual entity IDs
  light_entity: "light.living_room"
  media_player_entity: "media_player.living_room_speaker"
  climate_entity: "climate.living_room"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    board_build.flash_mode: dio
  on_boot:
    priority: 600
    then:
      # Initialize with a nice startup animation
      - light.turn_on:
          id: dial_light
          red: 100%
          green: 0%
          blue: 100%
          brightness: 50%
          effect: "Rainbow"
      - delay: 2s
      - light.turn_off: dial_light
      - component.update: dial_display

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# WiFi configuration with fallback AP and Improv support
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot when WiFi fails
  ap:
    ssid: "${friendly_name} Setup"
    password: "m5dial123"

  # Callbacks for WiFi events
  on_connect:
    - lambda: |-
        ESP_LOGI("wifi", "Connected to WiFi!");
    - light.turn_on:
        id: dial_light
        red: 0%
        green: 100%
        blue: 0%
        brightness: 50%
    - delay: 1s
    - light.turn_off: dial_light
    - component.update: dial_display

  on_disconnect:
    - lambda: |-
        ESP_LOGI("wifi", "Disconnected from WiFi!");
    - light.turn_on:
        id: dial_light
        red: 100%
        green: 0%
        blue: 0%
        brightness: 50%
        effect: "Pulse"
    - component.update: dial_display

# Captive portal for easy WiFi setup
captive_portal:

# Improv Serial - allows WiFi setup via web browser USB connection
improv_serial:

# I2C Bus for touchscreen
i2c:
  sda: GPIO11
  scl: GPIO12
  scan: true

# SPI Bus for display
spi:
  clk_pin: GPIO6
  mosi_pin: GPIO5

###################
# GLOBAL VARIABLES
###################

globals:
  # 0 = Light, 1 = Volume, 2 = Climate
  - id: control_mode
    type: int
    restore_value: yes
    initial_value: '0'

  # For smooth animations
  - id: display_brightness
    type: float
    restore_value: no
    initial_value: '0'

  # WiFi setup mode flag
  - id: wifi_setup_mode
    type: bool
    restore_value: no
    initial_value: 'false'

###################
# NUMBERS (Control Values)
###################

number:
  # Light brightness control
  - platform: template
    name: "Light Brightness"
    id: light_brightness
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    initial_value: 50
    on_value:
      then:
        - if:
            condition:
              lambda: 'return x > 0;'
            then:
              - homeassistant.service:
                  service: light.turn_on
                  data:
                    entity_id: ${light_entity}
                    brightness_pct: !lambda 'return x;'
            else:
              - homeassistant.service:
                  service: light.turn_off
                  data:
                    entity_id: ${light_entity}

  # Media player volume control
  - platform: template
    name: "Media Volume"
    id: media_volume
    min_value: 0
    max_value: 100
    step: 2
    optimistic: true
    initial_value: 30
    on_value:
      then:
        - homeassistant.service:
            service: media_player.volume_set
            data:
              entity_id: ${media_player_entity}
              volume_level: !lambda 'return x / 100.0;'

  # Climate temperature control
  - platform: template
    name: "Thermostat Temperature"
    id: thermostat_temp
    min_value: 15
    max_value: 30
    step: 0.5
    optimistic: true
    initial_value: 21
    unit_of_measurement: "°C"
    on_value:
      then:
        - homeassistant.service:
            service: climate.set_temperature
            data:
              entity_id: ${climate_entity}
              temperature: !lambda 'return x;'

###################
# SENSORS
###################

sensor:
  # Rotary Encoder
  - platform: rotary_encoder
    name: "Dial Encoder"
    id: dial_encoder
    pin_a:
      number: GPIO40
      mode:
        input: true
        pullup: true
    pin_b:
      number: GPIO41
      mode:
        input: true
        pullup: true
    resolution: 2
    on_clockwise:
      then:
        - lambda: |-
            // Increment based on current mode
            if (id(control_mode) == 0) {
              auto call = id(light_brightness).make_call();
              call.number_increment(false);
              call.perform();
            } else if (id(control_mode) == 1) {
              auto call = id(media_volume).make_call();
              call.number_increment(false);
              call.perform();
            } else if (id(control_mode) == 2) {
              auto call = id(thermostat_temp).make_call();
              call.number_increment(false);
              call.perform();
            }
        - light.turn_on:
            id: dial_light
            red: 0%
            green: 100%
            blue: 0%
            brightness: 30%
        - delay: 100ms
        - light.turn_off: dial_light
        - component.update: dial_display

    on_anticlockwise:
      then:
        - lambda: |-
            // Decrement based on current mode
            if (id(control_mode) == 0) {
              auto call = id(light_brightness).make_call();
              call.number_decrement(false);
              call.perform();
            } else if (id(control_mode) == 1) {
              auto call = id(media_volume).make_call();
              call.number_decrement(false);
              call.perform();
            } else if (id(control_mode) == 2) {
              auto call = id(thermostat_temp).make_call();
              call.number_decrement(false);
              call.perform();
            }
        - light.turn_on:
            id: dial_light
            red: 100%
            green: 50%
            blue: 0%
            brightness: 30%
        - delay: 100ms
        - light.turn_off: dial_light
        - component.update: dial_display

  # Get current temperature from climate entity
  - platform: homeassistant
    name: "Current Temperature"
    id: current_temp
    entity_id: ${climate_entity}
    attribute: current_temperature
    unit_of_measurement: "°C"

  # WiFi Signal Strength
  - platform: wifi_signal
    name: "WiFi Signal"
    id: wifi_signal_strength
    update_interval: 60s

###################
# BINARY SENSORS
###################

binary_sensor:
  # Center button (encoder push button)
  - platform: gpio
    name: "Dial Button"
    id: dial_button
    pin:
      number: GPIO42
      mode:
        input: true
        pullup: true
      inverted: true
    on_press:
      then:
        # Exit WiFi setup mode if active
        - if:
            condition:
              lambda: 'return id(wifi_setup_mode);'
            then:
              - lambda: |-
                  id(wifi_setup_mode) = false;
                  ESP_LOGI("wifi_setup", "Exited WiFi setup mode");
              - component.update: dial_display
            else:
              # Normal mode: Cycle through control modes
              - lambda: |-
                  id(control_mode) = (id(control_mode) + 1) % 3;
                  ESP_LOGI("mode", "Switched to mode %d", id(control_mode));
              - component.update: dial_display
              # Flash LED white to indicate mode change
              - light.turn_on:
                  id: dial_light
                  brightness: 100%
                  red: 100%
                  green: 100%
                  blue: 100%
              - delay: 200ms
              - light.turn_off: dial_light

    on_click:
      # Long press (3 seconds) = Enter WiFi setup mode
      min_length: 3000ms
      max_length: 10000ms
      then:
        - lambda: |-
            id(wifi_setup_mode) = true;
            ESP_LOGI("wifi_setup", "Entered WiFi setup mode - connect to fallback AP");
        - light.turn_on:
            id: dial_light
            brightness: 100%
            red: 0%
            green: 0%
            blue: 100%
            effect: "Pulse"
        - component.update: dial_display

  # WiFi connection status
  - platform: template
    name: "WiFi Connected"
    id: wifi_connected
    lambda: |-
      return wifi::global_wifi_component->is_connected();

###################
# BUTTONS (Actions from Home Assistant)
###################

button:
  # Button to enter WiFi setup mode from Home Assistant
  - platform: template
    name: "Enter WiFi Setup Mode"
    id: wifi_setup_button
    on_press:
      then:
        - lambda: |-
            id(wifi_setup_mode) = true;
            ESP_LOGI("wifi_setup", "WiFi setup mode activated via button");
        - light.turn_on:
            id: dial_light
            brightness: 100%
            red: 0%
            green: 0%
            blue: 100%
            effect: "Pulse"
        - component.update: dial_display

  # Button to restart the device
  - platform: restart
    name: "Restart M5Dial"

###################
# TOUCHSCREEN
###################

touchscreen:
  - platform: ft63x6
    id: my_touchscreen
    interrupt_pin: GPIO9
    on_touch:
      - lambda: |-
          ESP_LOGD("touch", "Touch at x=%d, y=%d", touch.x, touch.y);

          // Calculate distance from center
          int center_x = 120;
          int center_y = 120;
          int dx = touch.x - center_x;
          int dy = touch.y - center_y;
          int distance = sqrt(dx*dx + dy*dy);

          // If in WiFi setup mode, any touch exits
          if (id(wifi_setup_mode)) {
            id(wifi_setup_mode) = false;
            id(dial_display)->update();
            return;
          }

          // Bottom area touch (WiFi indicator area) = enter WiFi setup
          if (touch.y > 200) {
            id(wifi_setup_mode) = true;
            auto call = id(dial_light).turn_on();
            call.set_brightness(1.0);
            call.set_rgb(0.0, 0.0, 1.0);
            call.set_effect("Pulse");
            call.perform();
            id(dial_display)->update();
            return;
          }

          // Center touch = cycle modes
          if (distance < 50) {
            id(control_mode) = (id(control_mode) + 1) % 3;
            id(dial_display)->update();
          }

          // Outer ring touch = set value based on angle
          else if (distance > 70 && distance < 115) {
            float angle = atan2(dy, dx);
            // Convert angle to 0-100 range
            int percent = (int)(((angle + 3.14159) / (2 * 3.14159)) * 100);

            if (id(control_mode) == 0) {
              id(light_brightness).publish_state(percent);
            } else if (id(control_mode) == 1) {
              id(media_volume).publish_state(percent);
            } else if (id(control_mode) == 2) {
              float temp = 15 + (percent / 100.0) * 15;  // 15-30°C range
              id(thermostat_temp).publish_state(temp);
            }
            id(dial_display)->update();
          }

###################
# RGB LED
###################

light:
  - platform: esp32_rmt_led_strip
    id: dial_light
    name: "Dial LED"
    rgb_order: GRB
    pin: GPIO21
    num_leds: 1
    chipset: WS2812
    default_transition_length: 0s
    effects:
      - pulse:
          name: "Pulse"
          transition_length: 1s
          update_interval: 1s
      - random:
          name: "Random"
          transition_length: 5s
          update_interval: 3s
      - addressable_rainbow:
          name: "Rainbow"
          speed: 10
          width: 50

###################
# FONTS
###################

font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 28

  - file: "gfonts://Roboto"
    id: font_large
    size: 56

  - file: "gfonts://Roboto"
    id: font_medium
    size: 20

  - file: "gfonts://Roboto"
    id: font_small
    size: 14

  - file: "gfonts://Roboto"
    id: font_tiny
    size: 12

###################
# DISPLAY
###################

display:
  - platform: ili9xxx
    model: GC9A01A
    id: dial_display
    cs_pin: GPIO7
    dc_pin: GPIO4
    reset_pin: GPIO8
    invert_colors: false
    update_interval: 200ms
    rotation: 0
    lambda: |-
      //===========================================
      // WIFI SETUP MODE DISPLAY
      //===========================================
      if (id(wifi_setup_mode)) {
        // Draw WiFi setup screen
        it.print(120, 15, id(font_title), Color(0, 150, 255), TextAlign::CENTER, "WiFi Setup");

        it.filled_rectangle(10, 35, 220, 2, Color(0, 150, 255));

        if (!id(wifi_connected).state) {
          // Not connected - show setup instructions
          it.print(120, 55, id(font_small), Color(255, 255, 255), TextAlign::CENTER, "1. Connect WiFi");
          it.print(120, 75, id(font_medium), Color(255, 255, 0), TextAlign::CENTER, "SSID M5Dial Setup");
          it.print(120, 95, id(font_tiny), Color(150, 150, 150), TextAlign::CENTER, "Password m5dial123");

          it.print(120, 120, id(font_small), Color(255, 255, 255), TextAlign::CENTER, "2. Open browser");
          it.print(120, 138, id(font_small), Color(255, 255, 255), TextAlign::CENTER, "3. Setup WiFi");

          it.print(120, 170, id(font_tiny), Color(200, 200, 200), TextAlign::CENTER, "Or connect via USB");
          it.print(120, 185, id(font_tiny), Color(200, 200, 200), TextAlign::CENTER, "and use Improv");

        } else {
          // Connected - show current network
          it.print(120, 55, id(font_medium), Color(0, 255, 0), TextAlign::CENTER, "Connected!");

          // Show IP address
          if (wifi::global_wifi_component->is_connected()) {
            it.print(120, 90, id(font_small), Color(150, 150, 150), TextAlign::CENTER, "IP Address");
            auto addresses = wifi::global_wifi_component->get_ip_addresses();
            if (!addresses.empty()) {
              it.printf(120, 110, id(font_medium), Color(100, 200, 255), TextAlign::CENTER,
                       "%s", addresses[0].str().c_str());
            }
          }

          it.print(120, 155, id(font_small), Color(0, 255, 0), TextAlign::CENTER, "Press button or");
          it.print(120, 175, id(font_small), Color(0, 255, 0), TextAlign::CENTER, "touch to exit");
        }

        // Draw flashing WiFi icon area
        int blink = (millis() / 500) % 2;
        if (blink) {
          it.filled_circle(120, 215, 10, Color(0, 100, 255));
          it.print(120, 215, id(font_medium), Color(255, 255, 255), TextAlign::CENTER, "W");
        } else {
          it.circle(120, 215, 10, Color(0, 100, 255));
        }

        return;  // Exit early, don't draw normal control UI
      }

      //===========================================
      // NORMAL CONTROL MODE DISPLAY
      //===========================================

      // Get current value based on mode
      float current_value = 0;
      const char* mode_name = "";
      Color mode_color = Color(255, 255, 255);
      const char* unit = "";

      if (id(control_mode) == 0) {
        // Light mode
        current_value = id(light_brightness).state;
        mode_name = "LIGHT";
        mode_color = Color(255, 200, 0);  // Yellow
        unit = "%";
      } else if (id(control_mode) == 1) {
        // Volume mode
        current_value = id(media_volume).state;
        mode_name = "VOLUME";
        mode_color = Color(0, 255, 100);  // Green
        unit = "";
      } else if (id(control_mode) == 2) {
        // Climate mode
        current_value = id(thermostat_temp).state;
        mode_name = "CLIMATE";
        mode_color = Color(255, 100, 0);  // Orange
        unit = "°C";
      }

      // Draw mode title
      it.print(120, 25, id(font_title), mode_color, TextAlign::CENTER, mode_name);

      // Draw main value
      if (id(control_mode) == 2) {
        // Climate shows decimal
        it.printf(120, 90, id(font_large), Color(255, 255, 255), TextAlign::CENTER, "%.1f", current_value);
        it.print(180, 100, id(font_medium), Color(255, 255, 255), TextAlign::CENTER_LEFT, unit);
      } else {
        // Light and volume show integers
        it.printf(120, 90, id(font_large), Color(255, 255, 255), TextAlign::CENTER, "%d", (int)current_value);
        it.print(180, 100, id(font_medium), Color(255, 255, 255), TextAlign::CENTER_LEFT, unit);
      }

      // Draw circular progress indicator
      int center_x = 120;
      int center_y = 120;
      int radius = 100;
      float progress = 0;

      if (id(control_mode) == 0 || id(control_mode) == 1) {
        progress = current_value / 100.0;
      } else {
        progress = (current_value - 15.0) / 15.0;  // 15-30°C range
      }

      // Draw background circle
      it.circle(center_x, center_y, radius, Color(40, 40, 40));

      // Draw progress arc
      for (int angle = -90; angle < -90 + (360 * progress); angle += 2) {
        float rad = angle * 3.14159 / 180.0;
        int x = center_x + (int)(radius * cos(rad));
        int y = center_y + (int)(radius * sin(rad));
        it.filled_circle(x, y, 4, mode_color);
      }

      // Draw additional info for climate mode
      if (id(control_mode) == 2 && id(current_temp).has_state()) {
        float current = id(current_temp).state;
        it.printf(120, 160, id(font_small), Color(100, 200, 255), TextAlign::CENTER, "Current %.1f°C", current);

        // Status indicator
        const char* status = "IDLE";
        Color status_color = Color(100, 100, 100);

        if (current_value > current + 0.5) {
          status = "HEATING";
          status_color = Color(255, 50, 0);
        } else if (current_value < current - 0.5) {
          status = "COOLING";
          status_color = Color(0, 150, 255);
        } else {
          status = "OK";
          status_color = Color(0, 255, 0);
        }

        it.print(120, 180, id(font_tiny), status_color, TextAlign::CENTER, status);
      }

      // Mode indicator dots at bottom
      for (int i = 0; i < 3; i++) {
        int x = 90 + (i * 30);
        int y = 215;

        if (i == id(control_mode)) {
          it.filled_circle(x, y, 6, Color(255, 255, 255));
        } else {
          it.circle(x, y, 5, Color(80, 80, 80));
          it.filled_circle(x, y, 2, Color(80, 80, 80));
        }
      }

      // WiFi status indicator (top right)
      if (id(wifi_connected).state) {
        it.filled_circle(230, 10, 3, Color(0, 255, 0));
      } else {
        it.filled_circle(230, 10, 3, Color(255, 0, 0));
      }

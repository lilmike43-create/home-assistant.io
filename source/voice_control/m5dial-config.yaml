################################################################################################################
# M5Stack Dial - Home Assistant Multi-Function Controller
# Based on working M5Dial configuration with proven display settings
################################################################################################################

substitutions:
  # Device customization
  device_name: m5dial-controller
  friendly_name: M5Dial Controller

  # Home Assistant light entities (customize these!)
  light_1: "light.desk_lamp"
  light_2: "light.bedroom"
  light_3: "light.kitchen"
  light_4: "light.living_room"

  # Other entities
  climate_entity: "climate.living_room"
  switch_1: "switch.coffee_maker"

  # Display colors
  background_color: '000000'
  primary_color: 'FF8C00'      # Orange
  secondary_color: 'FFFFFF'    # White
  accent_color: '00D9FF'       # Cyan
  color_warm: 'FFB366'         # Warm white
  color_cool: '66B3FF'         # Cool white

  # Sounds
  menu_sound: 'beep:d=64,o=5,b=255:c7'
  success_sound: 'success:d=24,o=5,b=100:c,g,b'

################################################################################################################

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    then:
      - light.turn_on:
          id: backlight
          brightness: 100%
      - display.page.show: home_page
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 8MB
  framework:
    type: esp-idf

###################
# NETWORK
###################

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot if WiFi connection fails
  ap:
    ssid: "${friendly_name} Fallback"
    password: "m5dial123"

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:

###################
# HARDWARE
###################

# I2C Bus for touchscreen and RTC
i2c:
  - id: internal_i2c
    sda: GPIO11
    scl: GPIO12
    scan: false

# SPI Bus for display
spi:
  id: spi_bus
  mosi_pin: GPIO5
  clk_pin: GPIO6

# Touchscreen
touchscreen:
  - platform: ft5x06
    id: touchscreen_dial
    i2c_id: internal_i2c
    address: 0x38
    interrupt_pin: GPIO14
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false

# RTC (Real-Time Clock)
time:
  - platform: pcf8563
    id: rtctime
    i2c_id: internal_i2c
    address: 0x51
    update_interval: never

  - platform: homeassistant
    id: esptime
    on_time_sync:
      then:
        - pcf8563.write_time:

###################
# OUTPUTS
###################

output:
  # Buzzer for sound feedback
  - platform: ledc
    pin: GPIO3
    id: buzzer

  # Backlight PWM control
  - platform: ledc
    pin: GPIO9
    id: backlight_pwm

###################
# LIGHTS
###################

light:
  - platform: monochromatic
    name: "Backlight"
    output: backlight_pwm
    id: backlight
    default_transition_length: 0s
    restore_mode: ALWAYS_ON
    internal: true

###################
# SOUND
###################

rtttl:
  output: buzzer
  gain: 0.05

###################
# GLOBALS
###################

globals:
  # Selected device (1-4 for lights, 5 for climate, 6 for switch)
  - id: selected_device
    type: int
    restore_value: true
    initial_value: '1'

  # Control mode: 0=device_select, 1=brightness, 2=color_picker, 3=climate
  - id: control_mode
    type: int
    restore_value: false
    initial_value: '0'

  # RGB color values for color picker (0-255)
  - id: rgb_red
    type: int
    restore_value: false
    initial_value: '255'

  - id: rgb_green
    type: int
    restore_value: false
    initial_value: '255'

  - id: rgb_blue
    type: int
    restore_value: false
    initial_value: '255'

  # Color channel being adjusted: 0=red, 1=green, 2=blue
  - id: color_channel
    type: int
    restore_value: false
    initial_value: '0'

  # Inactivity timer
  - id: inactivity_time
    type: int
    restore_value: false
    initial_value: '0'

###################
# SENSORS
###################

sensor:
  # Rotary encoder for value control
  - platform: rotary_encoder
    id: encoder
    pin_a: GPIO40
    pin_b: GPIO41
    on_clockwise:
      then:
        - rtttl.play: ${menu_sound}
        - lambda: |-
            id(inactivity_time) = 0;

            // Mode 0: Device selection - cycle through devices
            if (id(control_mode) == 0) {
              id(selected_device) = (id(selected_device) % 6) + 1;
            }
            // Mode 1: Brightness control
            else if (id(control_mode) == 1) {
              // Brightness +10% for selected light
            }
            // Mode 2: RGB Color picker - adjust current channel
            else if (id(control_mode) == 2) {
              if (id(color_channel) == 0) id(rgb_red) = min(255, id(rgb_red) + 10);
              else if (id(color_channel) == 1) id(rgb_green) = min(255, id(rgb_green) + 10);
              else if (id(color_channel) == 2) id(rgb_blue) = min(255, id(rgb_blue) + 10);
            }
        # Brightness control for each light
        - if:
            condition:
              lambda: 'return id(control_mode) == 1 && id(selected_device) == 1;'
            then:
              - homeassistant.action:
                  service: light.turn_on
                  data:
                    entity_id: ${light_1}
                    brightness_step_pct: '10'
        - if:
            condition:
              lambda: 'return id(control_mode) == 1 && id(selected_device) == 2;'
            then:
              - homeassistant.action:
                  service: light.turn_on
                  data:
                    entity_id: ${light_2}
                    brightness_step_pct: '10'
        - if:
            condition:
              lambda: 'return id(control_mode) == 1 && id(selected_device) == 3;'
            then:
              - homeassistant.action:
                  service: light.turn_on
                  data:
                    entity_id: ${light_3}
                    brightness_step_pct: '10'
        - if:
            condition:
              lambda: 'return id(control_mode) == 1 && id(selected_device) == 4;'
            then:
              - homeassistant.action:
                  service: light.turn_on
                  data:
                    entity_id: ${light_4}
                    brightness_step_pct: '10'
        # Climate control
        - if:
            condition:
              lambda: 'return id(control_mode) == 3;'
            then:
              - homeassistant.action:
                  service: climate.set_temperature
                  data:
                    entity_id: ${climate_entity}
                  data_template:
                    temperature: '{{ my_variable | float }}'
                  variables:
                    my_variable: |-
                      return id(climate_temperature).state + 1.0;

    on_anticlockwise:
      then:
        - rtttl.play: ${menu_sound}
        - lambda: |-
            id(inactivity_time) = 0;

            // Mode 0: Device selection - cycle backwards
            if (id(control_mode) == 0) {
              id(selected_device) = id(selected_device) - 1;
              if (id(selected_device) < 1) id(selected_device) = 6;
            }
            // Mode 1: Brightness control (handled by actions below)
            // Mode 2: RGB Color picker - decrease current channel
            else if (id(control_mode) == 2) {
              if (id(color_channel) == 0) id(rgb_red) = max(0, id(rgb_red) - 10);
              else if (id(color_channel) == 1) id(rgb_green) = max(0, id(rgb_green) - 10);
              else if (id(color_channel) == 2) id(rgb_blue) = max(0, id(rgb_blue) - 10);
            }
        # Brightness control for each light
        - if:
            condition:
              lambda: 'return id(control_mode) == 1 && id(selected_device) == 1;'
            then:
              - homeassistant.action:
                  service: light.turn_on
                  data:
                    entity_id: ${light_1}
                    brightness_step_pct: '-10'
        - if:
            condition:
              lambda: 'return id(control_mode) == 1 && id(selected_device) == 2;'
            then:
              - homeassistant.action:
                  service: light.turn_on
                  data:
                    entity_id: ${light_2}
                    brightness_step_pct: '-10'
        - if:
            condition:
              lambda: 'return id(control_mode) == 1 && id(selected_device) == 3;'
            then:
              - homeassistant.action:
                  service: light.turn_on
                  data:
                    entity_id: ${light_3}
                    brightness_step_pct: '-10'
        - if:
            condition:
              lambda: 'return id(control_mode) == 1 && id(selected_device) == 4;'
            then:
              - homeassistant.action:
                  service: light.turn_on
                  data:
                    entity_id: ${light_4}
                    brightness_step_pct: '-10'
        # Climate control
        - if:
            condition:
              lambda: 'return id(control_mode) == 3;'
            then:
              - homeassistant.action:
                  service: climate.set_temperature
                  data:
                    entity_id: ${climate_entity}
                  data_template:
                    temperature: '{{ my_variable | float }}'
                  variables:
                    my_variable: |-
                      return id(climate_temperature).state - 1.0;

  # Home Assistant sensors for all lights
  - platform: homeassistant
    id: light_1_brightness
    entity_id: ${light_1}
    attribute: brightness
    internal: true
    filters:
      - lambda: 'if (isnan(x)) { return 0; } else { return x; }'

  - platform: homeassistant
    id: light_2_brightness
    entity_id: ${light_2}
    attribute: brightness
    internal: true
    filters:
      - lambda: 'if (isnan(x)) { return 0; } else { return x; }'

  - platform: homeassistant
    id: light_3_brightness
    entity_id: ${light_3}
    attribute: brightness
    internal: true
    filters:
      - lambda: 'if (isnan(x)) { return 0; } else { return x; }'

  - platform: homeassistant
    id: light_4_brightness
    entity_id: ${light_4}
    attribute: brightness
    internal: true
    filters:
      - lambda: 'if (isnan(x)) { return 0; } else { return x; }'

  - platform: homeassistant
    id: climate_temperature
    entity_id: ${climate_entity}
    attribute: temperature
    internal: true
    filters:
      - lambda: 'if (isnan(x)) { return 20; } else { return x; }'

###################
# TEXT SENSORS
###################

text_sensor:
  # Entity states for all lights
  - platform: homeassistant
    id: light_1_state
    entity_id: ${light_1}
    internal: true

  - platform: homeassistant
    id: light_2_state
    entity_id: ${light_2}
    internal: true

  - platform: homeassistant
    id: light_3_state
    entity_id: ${light_3}
    internal: true

  - platform: homeassistant
    id: light_4_state
    entity_id: ${light_4}
    internal: true

  - platform: homeassistant
    id: climate_state
    entity_id: ${climate_entity}
    internal: true

  - platform: homeassistant
    id: switch_1_state
    entity_id: ${switch_1}
    internal: true

  - platform: wifi_info
    ip_address:
      id: wifi_ip
      internal: true

###################
# BINARY SENSORS
###################

binary_sensor:
  # Front button (center push button)
  - platform: gpio
    name: "Front Button"
    id: front_button
    pin:
      number: GPIO42
      inverted: true
    internal: true
    on_press:
      then:
        - rtttl.play: ${menu_sound}
        - lambda: |-
            id(inactivity_time) = 0;

            // Mode 0 (device select): Enter brightness mode
            if (id(control_mode) == 0) {
              if (id(selected_device) <= 4) {
                id(control_mode) = 1;  // Brightness mode for lights
              } else if (id(selected_device) == 5) {
                id(control_mode) = 3;  // Climate mode
              }
            }
            // Any other mode: Return to home
            else {
              id(control_mode) = 0;
            }

  # Touchscreen - Home button (always visible)
  - platform: touchscreen
    name: "Home Button"
    internal: true
    x_min: 80
    x_max: 160
    y_min: 0
    y_max: 50
    on_press:
      - rtttl.play: ${menu_sound}
      - lambda: |-
          id(control_mode) = 0;
          id(inactivity_time) = 0;

  # Touchscreen - Color mode button (when in brightness mode)
  - platform: touchscreen
    name: "Color Mode Button"
    internal: true
    x_min: 0
    x_max: 70
    y_min: 0
    y_max: 70
    on_press:
      - lambda: |-
          if (id(control_mode) == 1) {  // Only in brightness mode
            id(control_mode) = 2;  // Switch to color picker
            id(color_channel) = 0;  // Start with red channel
          }

  # Touchscreen - Apply RGB color (when in color picker mode)
  - platform: touchscreen
    name: "Apply Color Button"
    internal: true
    x_min: 170
    x_max: 240
    y_min: 0
    y_max: 70
    on_press:
      - lambda: |-
          if (id(control_mode) == 2) {  // In color picker mode
            // Will trigger service call based on selected device
            id(control_mode) = 1;  // Return to brightness mode
          }
      # Apply color to selected light
      - if:
          condition:
            lambda: 'return id(control_mode) == 1 && id(selected_device) == 1;'
          then:
            - homeassistant.action:
                service: light.turn_on
                data:
                  entity_id: ${light_1}
                data_template:
                  rgb_color: '{{ my_color }}'
                variables:
                  my_color: |-
                    char buf[32];
                    sprintf(buf, "[%d,%d,%d]", id(rgb_red), id(rgb_green), id(rgb_blue));
                    return std::string(buf);
      - if:
          condition:
            lambda: 'return id(control_mode) == 1 && id(selected_device) == 2;'
          then:
            - homeassistant.action:
                service: light.turn_on
                data:
                  entity_id: ${light_2}
                data_template:
                  rgb_color: '{{ my_color }}'
                variables:
                  my_color: |-
                    char buf[32];
                    sprintf(buf, "[%d,%d,%d]", id(rgb_red), id(rgb_green), id(rgb_blue));
                    return std::string(buf);
      - if:
          condition:
            lambda: 'return id(control_mode) == 1 && id(selected_device) == 3;'
          then:
            - homeassistant.action:
                service: light.turn_on
                data:
                  entity_id: ${light_3}
                data_template:
                  rgb_color: '{{ my_color }}'
                variables:
                  my_color: |-
                    char buf[32];
                    sprintf(buf, "[%d,%d,%d]", id(rgb_red), id(rgb_green), id(rgb_blue));
                    return std::string(buf);
      - if:
          condition:
            lambda: 'return id(control_mode) == 1 && id(selected_device) == 4;'
          then:
            - homeassistant.action:
                service: light.turn_on
                data:
                  entity_id: ${light_4}
                data_template:
                  rgb_color: '{{ my_color }}'
                variables:
                  my_color: |-
                    char buf[32];
                    sprintf(buf, "[%d,%d,%d]", id(rgb_red), id(rgb_green), id(rgb_blue));
                    return std::string(buf);

  # Touchscreen - Switch RGB channel (bottom center, when in color picker)
  - platform: touchscreen
    name: "Next RGB Channel"
    internal: true
    x_min: 80
    x_max: 160
    y_min: 190
    y_max: 240
    on_press:
      - rtttl.play: ${menu_sound}
      - lambda: |-
          if (id(control_mode) == 2) {  // In color picker mode
            id(color_channel) = (id(color_channel) + 1) % 3;  // Cycle R->G->B->R
          }

###################
# INTERVALS
###################

interval:
  # Inactivity timer
  - interval: 1s
    then:
      - lambda: |-
          id(inactivity_time) += 1;

          // Dim backlight after 30 seconds of inactivity
          if (id(inactivity_time) == 30) {
            auto call = id(backlight).turn_on();
            call.set_brightness(0.3);
            call.perform();
          }

          // Return to home after 60 seconds
          if (id(inactivity_time) == 60) {
            id(control_mode) = 0;
            id(dial_display).show_page(id(home_page));
            auto call = id(backlight).turn_on();
            call.set_brightness(1.0);
            call.perform();
          }

###################
# COLORS
###################

color:
  - id: color_background
    hex: ${background_color}
  - id: color_primary
    hex: ${primary_color}
  - id: color_secondary
    hex: ${secondary_color}
  - id: color_accent
    hex: ${accent_color}
  - id: color_warm
    hex: ${color_warm}
  - id: color_cool
    hex: ${color_cool}
  - id: color_on
    hex: '00FF00'
  - id: color_off
    hex: '666666'
  - id: color_red
    hex: 'FF0000'
  - id: color_green
    hex: '00FF00'
  - id: color_blue
    hex: '0000FF'

###################
# FONTS
###################

font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 24
    glyphs: " !\"#$%&'()*+,-./:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°0123456789"

  - file: "gfonts://Roboto"
    id: font_large
    size: 48
    glyphs: " !\"#$%&'()*+,-./:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°0123456789"

  - file: "gfonts://Roboto"
    id: font_medium
    size: 20
    glyphs: " !\"#$%&'()*+,-./:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°0123456789"

  - file: "gfonts://Roboto"
    id: font_small
    size: 14
    glyphs: " !\"#$%&'()*+,-./:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~°0123456789"

###################
# DISPLAY
###################

display:
  - platform: ili9xxx
    id: dial_display
    model: GC9A01A
    cs_pin: GPIO7
    dc_pin: GPIO4
    reset_pin: GPIO8
    invert_colors: true
    update_interval: 0.05s
    rotation: 0
    pages:
      ###################
      # HOME PAGE
      ###################
      - id: home_page
        lambda: |-
          // Background
          it.filled_circle(120, 120, 120, id(color_background));

          // Title
          it.print(120, 20, id(font_title), id(color_primary), TextAlign::TOP_CENTER, "M5Dial Control");

          // Time display
          it.strftime(120, 60, id(font_medium), id(color_secondary), TextAlign::TOP_CENTER, "%H %M", id(esptime).now());

          // Mode indicators in circular layout
          // Mode 1 - Light (top)
          if (id(control_mode) == 1) {
            it.filled_circle(120, 90, 25, id(color_primary));
          } else {
            it.circle(120, 90, 25, id(color_primary));
          }
          it.print(120, 90, id(font_small), id(color_secondary), TextAlign::CENTER, "Light");

          // Mode 2 - Media (right)
          if (id(control_mode) == 2) {
            it.filled_circle(180, 135, 25, id(color_primary));
          } else {
            it.circle(180, 135, 25, id(color_primary));
          }
          it.print(180, 135, id(font_small), id(color_secondary), TextAlign::CENTER, "Media");

          // Mode 3 - Climate (left)
          if (id(control_mode) == 3) {
            it.filled_circle(60, 135, 25, id(color_primary));
          } else {
            it.circle(60, 135, 25, id(color_primary));
          }
          it.print(60, 135, id(font_small), id(color_secondary), TextAlign::CENTER, "Temp");

          // Instructions
          it.print(120, 200, id(font_small), id(color_secondary), TextAlign::TOP_CENTER, "Press button to select mode");

      ###################
      # CONTROL PAGE
      ###################
      - id: control_page
        lambda: |-
          // Background
          it.filled_circle(120, 120, 120, id(color_background));

          // Home button at top
          it.print(120, 10, id(font_small), id(color_primary), TextAlign::TOP_CENTER, "< Home");

          // Display based on current mode
          if (id(control_mode) == 1) {
            // Light Control
            it.print(120, 40, id(font_title), id(color_primary), TextAlign::TOP_CENTER, "Light");

            // State - check if loaded
            if (id(light_state).has_state()) {
              std::string state_text = (id(light_state).state == "on") ? "ON" : "OFF";
              auto state_color = (id(light_state).state == "on") ? id(color_on) : id(color_off);
              it.print(120, 75, id(font_medium), state_color, TextAlign::TOP_CENTER, state_text.c_str());
            } else {
              it.print(120, 75, id(font_medium), id(color_secondary), TextAlign::TOP_CENTER, "Loading...");
            }

            // Brightness circle - check if loaded
            if (!isnan(id(light_brightness).state)) {
              float brightness_pct = (id(light_brightness).state / 255.0) * 100.0;
              int arc_degrees = (int)(brightness_pct * 3.6);

              // Draw arc showing brightness level
              for (int angle = 0; angle < arc_degrees; angle++) {
                float rad = (angle - 90) * 0.01745329;
                int x = 120 + (int)(60 * cos(rad));
                int y = 140 + (int)(60 * sin(rad));
                it.filled_circle(x, y, 3, id(color_primary));
              }

              // Brightness percentage
              it.printf(120, 140, id(font_large), id(color_secondary), TextAlign::CENTER, "%.0f%%", brightness_pct);
            }

            it.print(120, 200, id(font_small), id(color_secondary), TextAlign::TOP_CENTER, "Turn to adjust");
          }
          else if (id(control_mode) == 2) {
            // Media Player Control
            it.print(120, 40, id(font_title), id(color_primary), TextAlign::TOP_CENTER, "Media");

            // State - check if loaded
            if (id(media_state).has_state()) {
              std::string state_text = (id(media_state).state == "playing") ? "PLAYING" :
                                      (id(media_state).state == "paused") ? "PAUSED" : "OFF";
              auto state_color = (id(media_state).state == "playing") ? id(color_on) : id(color_off);
              it.print(120, 75, id(font_medium), state_color, TextAlign::TOP_CENTER, state_text.c_str());
            } else {
              it.print(120, 75, id(font_medium), id(color_secondary), TextAlign::TOP_CENTER, "Loading...");
            }

            // Volume circle - check if loaded
            if (!isnan(id(media_volume).state)) {
              float volume_pct = id(media_volume).state * 100.0;
              int arc_degrees = (int)(volume_pct * 3.6);

              // Draw arc showing volume level
              for (int angle = 0; angle < arc_degrees; angle++) {
                float rad = (angle - 90) * 0.01745329;
                int x = 120 + (int)(60 * cos(rad));
                int y = 140 + (int)(60 * sin(rad));
                it.filled_circle(x, y, 3, id(color_primary));
              }

              // Volume percentage
              it.printf(120, 140, id(font_large), id(color_secondary), TextAlign::CENTER, "%.0f%%", volume_pct);
            }

            it.print(120, 200, id(font_small), id(color_secondary), TextAlign::TOP_CENTER, "Turn to adjust volume");
          }
          else if (id(control_mode) == 3) {
            // Climate Control
            it.print(120, 40, id(font_title), id(color_primary), TextAlign::TOP_CENTER, "Climate");

            // State - check if loaded
            if (id(climate_state).has_state()) {
              std::string state_text = (id(climate_state).state == "heat") ? "HEATING" :
                                      (id(climate_state).state == "cool") ? "COOLING" : "OFF";
              auto state_color = (id(climate_state).state == "off") ? id(color_off) : id(color_on);
              it.print(120, 75, id(font_medium), state_color, TextAlign::TOP_CENTER, state_text.c_str());
            } else {
              it.print(120, 75, id(font_medium), id(color_secondary), TextAlign::TOP_CENTER, "Loading...");
            }

            // Temperature circle - check if loaded
            if (!isnan(id(climate_temperature).state)) {
              float temp = id(climate_temperature).state;
              int arc_degrees = (int)((temp - 15) * 12);  // 15°C = 0°, 45°C = 360°
              if (arc_degrees < 0) arc_degrees = 0;
              if (arc_degrees > 360) arc_degrees = 360;

              // Draw arc showing temperature
              for (int angle = 0; angle < arc_degrees; angle++) {
                float rad = (angle - 90) * 0.01745329;
                int x = 120 + (int)(60 * cos(rad));
                int y = 140 + (int)(60 * sin(rad));
                it.filled_circle(x, y, 3, id(color_primary));
              }

              // Temperature value
              it.printf(120, 140, id(font_large), id(color_secondary), TextAlign::CENTER, "%.1f C", temp);
            }

            it.print(120, 200, id(font_small), id(color_secondary), TextAlign::TOP_CENTER, "Turn to adjust temp");
          }

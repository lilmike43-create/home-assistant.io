# M5Dial Secrets Template
# Copy this to your ESPHome secrets.yaml file and fill in your values

# WiFi credentials (must be 2.4 GHz network)
wifi_ssid: "YourWiFiNetworkName"
wifi_password: "YourWiFiPassword"

# ESPHome API encryption key
# Generate a new key by running: openssl rand -base64 32
api_encryption_key: "your-32-byte-base64-encryption-key-here"

# OTA (Over-The-Air) update password
# Choose a secure password for wireless firmware updates
ota_password: "your-secure-ota-password"
